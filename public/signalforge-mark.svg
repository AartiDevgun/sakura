
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="sakuraPetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF0F7"/>
      <stop offset="55%" stop-color="#F9A8D4"/>
      <stop offset="100%" stop-color="#DB2777"/>
    </linearGradient>
  </defs>

  <!-- Five sakura petals -->
  <g fill="url(#sakuraPetal)" fill-opacity="0.3"
     stroke="#FBCFE8" stroke-width="2.5"
     stroke-linecap="round" stroke-linejoin="round">
    <path id="petal"
      d="M64 61
         C55 55 44 46 46 34
         C48 24 57 21 64 34
         C71 21 80 24 82 34
         C84 46 73 55 64 61 Z"/>
    <use href="#petal" transform="rotate(72 64 64)"/>
    <use href="#petal" transform="rotate(144 64 64)"/>
    <use href="#petal" transform="rotate(216 64 64)"/>
    <use href="#petal" transform="rotate(288 64 64)"/>
  </g>

  <!-- Central financial emblem -->
  <circle cx="64" cy="64" r="17"
          fill="#21101C" stroke="#F472B6" stroke-width="2"/>

  <text x="64" y="76"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="34"
        font-weight="bold"
        fill="#FFF0F7">₹</text>
</svg>
